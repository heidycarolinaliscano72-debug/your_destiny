services:
  - type: web
    name: your-destiny
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: WHATSAPP_NUMBER
        value: "573227618659"
      # Opcional: pega aquí tu URL de PostgreSQL (Neon, Supabase o Render Postgres)
      # para persistencia entre reinicios. Si lo dejas vacío, usa SQLite local.
      - key: DATABASE_URL
        sync: false
