services:
  db:
    image: mysql:8.0
    container_name: your_destiny_db
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_spanish_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: your_destiny
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    container_name: your_destiny_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: your_destiny
      SECRET_KEY: cambia-esta-clave-en-produccion
    ports:
      - "5000:5000"

volumes:
  db_data:
